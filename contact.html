<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShoeLink Footwear</title>
    <meta name="description" content="Contact ShoeLink for footwear quotes and partnership inquiries.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RG4R8ZM6Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6RG4R8ZM6Q');
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; color: #2d3748; }
        .navbar-custom { background: rgba(15,26,46,0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .page-header { background: linear-gradient(135deg, #1F3A5F, #2a4a6f); padding: 100px 0 40px; }
        .btn-gold { background: linear-gradient(135deg, #C9A24B, #d4af5e); border: none; color: #1F3A5F; font-weight: 700; padding: 12px 28px; border-radius: 30px; transition: all 0.3s; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201,162,75,0.5); }
        .footer-custom { background: #0f1a2e; }
        .footer-social a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 10px; font-size: 1.5rem; transition: color 0.3s; }
        .footer-social a:hover { color: #C9A24B; }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="font-size:1.3rem;">ShoeLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-warning btn-sm text-dark fw-bold px-3" href="sample-request.html" style="border-radius:25px;">Request Sample</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <header class="page-header text-white">
        <div class="container">
            <h1 class="fw-bold h3 mb-0">Contact Us</h1>
        </div>
    </header>

    <!-- 联系表单 -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-7 mb-4">
                    <h4 class="mb-4 fw-bold" style="color:#1F3A5F;">Get a Quote / Inquiry</h4>
                    <form id="contactForm" action="https://formspree.io/f/xyegqjlg" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name *</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Company</label>
                                <input type="text" class="form-control" name="company">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Country *</label>
                                <input type="text" class="form-control" name="country" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Interest</label>
                            <input type="text" class="form-control" name="product" id="productInterest">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message *</label>
                            <textarea class="form-control" name="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-gold btn-lg">Send Message</button>
                    </form>
                </div>
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3" style="color:#1F3A5F;">Contact Information</h5>
                        <p class="mb-2"><strong>Email:</strong> <span id="contactEmail"></span></p>
                        <p class="mb-2"><strong>Phone:</strong> <span id="contactPhone"></span></p>
                        <p class="mb-2"><strong>WhatsApp:</strong> <span id="contactWhatsapp"></span></p>
                        <p class="mb-0"><strong>Address:</strong> <span id="contactAddress"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer-custom text-white py-5">
        <div class="container text-center">
            <p class="fw-bold mb-3" style="font-size:1.2rem;">ShoeLink</p>
            <div class="footer-social mb-3" id="footerSocial"></div>
            <p class="small mb-1" id="footerContact"></p>
            <p class="small opacity-50">© 2026 ShoeLink. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function loadJSON(url) {
        try { const r = await fetch(url); return await r.json(); } catch(e) { return null; }
    }

    async function init() {
        const site = await loadJSON('_data/site.json') || {};

        document.getElementById('contactEmail').textContent = site.contactEmail || '';
        document.getElementById('contactPhone').textContent = site.phone || '';
        document.getElementById('contactWhatsapp').textContent = site.whatsapp || '';
        document.getElementById('contactAddress').textContent = site.address || '';

        // 检查URL中是否有product参数
        const params = new URLSearchParams(window.location.search);
        const product = params.get('product');
        if (product) {
            document.getElementById('productInterest').value = product;
        }

        // 页脚
        const social = site.socialLinks || {};
        const icons = { facebook: '📘', tiktok: '🎵', linkedin: '💼', instagram: '📸' };
        let socialHtml = '';
        for (const key in icons) {
            if (social[key] && social[key] !== '#') {
                socialHtml += '<a href="' + social[key] + '" target="_blank">' + icons[key] + '</a>';
            }
        }
        if (site.whatsapp) {
            socialHtml += '<a href="https://wa.me/' + site.whatsapp.replace(/[^0-9]/g,'') + '" target="_blank">💬</a>';
        }
        document.getElementById('footerSocial').innerHTML = socialHtml;
        document.getElementById('footerContact').textContent = 'Email: ' + (site.contactEmail || '') + ' | Phone: ' + (site.phone || '');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
