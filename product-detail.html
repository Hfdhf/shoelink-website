<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShoeLink Footwear</title>
    <meta name="description" content="View detailed product information and request a quote.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Tawk.to 占位 -->
    <script type="text/javascript">
        var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
        (function(){
            var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
            s1.async=true;
            s1.src='https://embed.tawk.to/YOUR_TAWK_ID/default';
            s1.charset='UTF-8';
            s1.setAttribute('crossorigin','*');
            s0.parentNode.insertBefore(s1,s0);
        })();
    </script>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #1F3A5F;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ShoeLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-warning btn-sm ms-2 text-dark fw-bold" href="sample-request.html">Request Sample</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 产品详情区域 -->
    <section class="py-5" style="padding-top: 100px !important;">
        <div class="container" id="productDetail">
            <!-- 由 JS 动态渲染产品详情 -->
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-1">&copy; 2025 ShoeLink. All rights reserved.</p>
            <p class="mb-1">
                <a href="#" class="text-white me-2">Facebook</a>
                <a href="#" class="text-white me-2">Instagram</a>
                <a href="#" class="text-white">LinkedIn</a>
            </p>
            <p class="small mb-0">Contact us: info@shoelink.com | WhatsApp: +123456789</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 产品详情 JS -->
    <script>
        // 加载站点信息
        async function loadSiteInfo() {
            try {
                const response = await fetch('_data/site.json');
                const siteData = await response.json();
                document.querySelectorAll('.navbar-brand').forEach(el => {
                    el.textContent = siteData.brandName || 'ShoeLink';
                });
                const footerContact = document.querySelector('footer .small');
                if (footerContact && siteData.contactEmail) {
                    footerContact.textContent = `Contact us: ${siteData.contactEmail} | WhatsApp: ${siteData.whatsapp || ''}`;
                }
            } catch (error) {
                console.error('Error loading site info:', error);
            }
        }

        // 加载产品
        async function loadProducts() {
            try {
                const response = await fetch('_data/products.json');
                const data = await response.json();
                return data.products || data;
            } catch (error) {
                console.error('Error loading products:', error);
                return [];
            }
        }

        // 渲染产品详情
        async function renderProductDetail() {
            const container = document.getElementById('productDetail');
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            
            if (!productId) {
                container.innerHTML = '<div class="alert alert-warning">Product ID not found. Please go back to <a href="products.html">Products</a>.</div>';
                return;
            }
            
            const products = await loadProducts();
            const product = products.find(p => p.id === productId);
            
            if (!product) {
                container.innerHTML = '<div class="alert alert-warning">Product not found. Please go back to <a href="products.html">Products</a>.</div>';
                return;
            }
            
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <img src="${product.image || 'https://via.placeholder.com/600x400?text=Product'}" class="img-fluid rounded shadow" alt="${product.name}">
                    </div>
                    <div class="col-md-6">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="products.html">Products</a></li>
                                <li class="breadcrumb-item active" aria-current="page">${product.name}</li>
                            </ol>
                        </nav>
                        <h1 class="fw-bold" style="color:#1F3A5F;">${product.name}</h1>
                        <p class="text-muted">Category: ${product.category || 'Uncategorized'}</p>
                        <p class="lead">${product.description || 'No description available.'}</p>
                        <p><strong>Price Range:</strong> ${product.priceRange || 'Price on request'}</p>
                        
                        <div class="mt-4">
                            <a href="contact.html?product=${encodeURIComponent(product.name)}" class="btn btn-warning btn-lg text-dark fw-bold me-2">Get a Quote</a>
                            <a href="sample-request.html?product=${encodeURIComponent(product.name)}" class="btn btn-outline-primary btn-lg">Request Sample</a>
                        </div>
                        
                        <div class="mt-4 p-3 bg-light rounded">
                            <h5>Quick Inquiry</h5>
                            <p class="small mb-2">Interested in this product? Fill out the form and we'll get back to you within 24 hours.</p>
                            <a href="contact.html?product=${encodeURIComponent(product.name)}" class="btn btn-primary btn-sm">Contact Now</a>
                        </div>
                    </div>
                </div>
                
                <!-- 相关产品 -->
                <div class="mt-5">
                    <h3 class="mb-4" style="color:#1F3A5F;">Related Products</h3>
                    <div class="row" id="relatedProducts">
                        <!-- 由 JS 动态渲染相关产品 -->
                    </div>
                </div>
            `;
            
            // 渲染相关产品（同分类的其他产品）
            const relatedProducts = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
            const relatedContainer = document.getElementById('relatedProducts');
            
            if (relatedProducts.length > 0) {
                relatedContainer.innerHTML = relatedProducts.map(related => `
                    <div class="col-md-3 col-sm-6 mb-4">
                        <div class="card product-card">
                            <img src="${related.image || 'https://via.placeholder.com/600x400?text=Product'}" class="product-img" alt="${related.name}">
                            <div class="card-body">
                                <h5 class="card-title">${related.name}</h5>
                                <p class="card-text text-muted small">${related.category || ''}</p>
                                <a href="product-detail.html?id=${related.id}" class="btn btn-outline-primary btn-sm w-100">View Details</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                relatedContainer.innerHTML = '<div class="col-12"><p>No related products found.</p></div>';
            }
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', async function() {
            await loadSiteInfo();
            await renderProductDetail();
        });
    </script>
</body>
</html>
