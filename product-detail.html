<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShoeLink Footwear</title>
    <meta name="description" content="View product details and request a quote.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RG4R8ZM6Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6RG4R8ZM6Q');
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; color: #2d3748; display: flex; flex-direction: column; min-height: 100vh; }
        footer { margin-top: auto; }
        .navbar-custom { background: rgba(15,26,46,0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .page-header { background: linear-gradient(135deg, #1F3A5F, #2a4a6f); padding: 100px 0 40px; }
        .product-detail-img { width: 100%; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product-id-badge { background: #C9A24B; color: #1F3A5F; font-weight: 700; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; display: inline-block; }
        .product-price-large { font-size: 2rem; font-weight: 800; color: #1F3A5F; }
        .btn-gold { background: linear-gradient(135deg, #C9A24B, #d4af5e); border: none; color: #1F3A5F; font-weight: 700; padding: 12px 28px; border-radius: 30px; transition: all 0.3s; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201,162,75,0.5); }
        .btn-outline-navy { border: 2px solid #1F3A5F; color: #1F3A5F; font-weight: 600; padding: 12px 28px; border-radius: 30px; transition: all 0.3s; }
        .btn-outline-navy:hover { background: #1F3A5F; color: white; }
        .footer-custom { background: #0f1a2e; }
        .footer-social a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 10px; font-size: 1.5rem; transition: color 0.3s; }
        .footer-social a:hover { color: #C9A24B; }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="font-size:1.3rem;">ShoeLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-warning btn-sm text-dark fw-bold px-3" href="sample-request.html" style="border-radius:25px;">Request Sample</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 产品详情 -->
    <header class="page-header text-white">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="products.html" class="text-white-50">Products</a></li>
                    <li class="breadcrumb-item active text-white" id="breadcrumbProduct"></li>
                </ol>
            </nav>
        </div>
    </header>

    <section class="py-5">
        <div class="container" id="productDetail"></div>
    </section>

    <!-- 页脚 -->
    <footer class="footer-custom text-white py-5">
        <div class="container text-center">
            <p class="fw-bold mb-3" style="font-size:1.2rem;">ShoeLink</p>
            <div class="footer-social mb-3" id="footerSocial"></div>
            <p class="small mb-1" id="footerContact"></p>
            <p class="small opacity-50">© 2026 ShoeLink. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function loadJSON(url) {
        try { const r = await fetch(url); return await r.json(); } catch(e) { return null; }
    }

    function getProductId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || '';
    }

    async function init() {
        const site = await loadJSON('_data/site.json') || {};
        const prods = await loadJSON('_data/products.json') || [];
        const productId = getProductId();
        const product = prods.find(function(p) { return p.id === productId; });

        const container = document.getElementById('productDetail');

        if (!product) {
            container.innerHTML = '<div class="alert alert-warning">Product not found. <a href="products.html">Go back to Products</a></div>';
        } else {
            document.getElementById('breadcrumbProduct').textContent = product.id + ' - ' + product.name;
            container.innerHTML = 
                '<div class="row">' +
                '  <div class="col-lg-6 mb-4">' +
                '    <img src="' + product.image + '" alt="' + product.name + '" class="product-detail-img">' +
                '  </div>' +
                '  <div class="col-lg-6">' +
                '    <span class="product-id-badge">' + product.id + '</span>' +
                '    <h1 class="fw-bold mt-3" style="color:#1F3A5F;">' + product.name + '</h1>' +
                '    <p class="text-muted">Category: ' + product.category + '</p>' +
                '    <p class="product-price-large">' + product.price + '</p>' +
                '    <p class="lead">' + (product.description || '') + '</p>' +
                '    <div class="mt-4 d-flex flex-wrap gap-3">' +
                '      <a href="contact.html?product=' + encodeURIComponent(product.id + ' - ' + product.name) + '" class="btn btn-gold btn-lg">Get a Quote</a>' +
                '      <a href="sample-request.html?product=' + encodeURIComponent(product.id + ' - ' + product.name) + '" class="btn btn-outline-navy btn-lg">Request Sample</a>' +
                '    </div>' +
                '  </div>' +
                '</div>';
        }

        // 页脚 - 专业SVG品牌图标
        const social = site.socialLinks || {};
        const svgIcons = {
            facebook: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
            tiktok: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#000000"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
            linkedin: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
            instagram: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#E4405F"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>',
            whatsapp: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
        };
        let socialHtml = '';
        for (const key in svgIcons) {
            if (key === 'whatsapp') {
                if (site.whatsapp) {
                    socialHtml += '<a href="https://wa.me/' + site.whatsapp.replace(/[^0-9]/g,'') + '" target="_blank" title="WhatsApp" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:white;border-radius:50%;margin:0 6px;transition:transform 0.3s;">' + svgIcons[key] + '</a>';
                }
            } else {
                if (social[key] && social[key] !== '#') {
                    socialHtml += '<a href="' + social[key] + '" target="_blank" title="' + key + '" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:white;border-radius:50%;margin:0 6px;transition:transform 0.3s;">' + svgIcons[key] + '</a>';
                }
            }
        }
        document.getElementById('footerSocial').innerHTML = socialHtml;
        document.getElementById('footerContact').textContent = 'Email: ' + (site.contactEmail || '') + ' | Phone: ' + (site.phone || '');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
