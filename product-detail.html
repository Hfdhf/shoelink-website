<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShoeLink Footwear</title>
    <meta name="description" content="View product details and request a quote.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RG4R8ZM6Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6RG4R8ZM6Q');
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; color: #2d3748; }
        .navbar-custom { background: rgba(15,26,46,0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
        .page-header { background: linear-gradient(135deg, #1F3A5F, #2a4a6f); padding: 100px 0 40px; }
        .product-detail-img { width: 100%; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product-id-badge { background: #C9A24B; color: #1F3A5F; font-weight: 700; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; display: inline-block; }
        .product-price-large { font-size: 2rem; font-weight: 800; color: #1F3A5F; }
        .btn-gold { background: linear-gradient(135deg, #C9A24B, #d4af5e); border: none; color: #1F3A5F; font-weight: 700; padding: 12px 28px; border-radius: 30px; transition: all 0.3s; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(201,162,75,0.5); }
        .btn-outline-navy { border: 2px solid #1F3A5F; color: #1F3A5F; font-weight: 600; padding: 12px 28px; border-radius: 30px; transition: all 0.3s; }
        .btn-outline-navy:hover { background: #1F3A5F; color: white; }
        .footer-custom { background: #0f1a2e; }
        .footer-social a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 10px; font-size: 1.5rem; transition: color 0.3s; }
        .footer-social a:hover { color: #C9A24B; }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="font-size:1.3rem;">ShoeLink</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link btn btn-warning btn-sm text-dark fw-bold px-3" href="sample-request.html" style="border-radius:25px;">Request Sample</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 产品详情 -->
    <header class="page-header text-white">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="products.html" class="text-white-50">Products</a></li>
                    <li class="breadcrumb-item active text-white" id="breadcrumbProduct"></li>
                </ol>
            </nav>
        </div>
    </header>

    <section class="py-5">
        <div class="container" id="productDetail"></div>
    </section>

    <!-- 页脚 -->
    <footer class="footer-custom text-white py-5">
        <div class="container text-center">
            <p class="fw-bold mb-3" style="font-size:1.2rem;">ShoeLink</p>
            <div class="footer-social mb-3" id="footerSocial"></div>
            <p class="small mb-1" id="footerContact"></p>
            <p class="small opacity-50">© 2026 ShoeLink. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function loadJSON(url) {
        try { const r = await fetch(url); return await r.json(); } catch(e) { return null; }
    }

    function getProductId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || '';
    }

    async function init() {
        const site = await loadJSON('_data/site.json') || {};
        const prods = await loadJSON('_data/products.json') || [];
        const productId = getProductId();
        const product = prods.find(function(p) { return p.id === productId; });

        const container = document.getElementById('productDetail');

        if (!product) {
            container.innerHTML = '<div class="alert alert-warning">Product not found. <a href="products.html">Go back to Products</a></div>';
        } else {
            document.getElementById('breadcrumbProduct').textContent = product.id + ' - ' + product.name;
            container.innerHTML = 
                '<div class="row">' +
                '  <div class="col-lg-6 mb-4">' +
                '    <img src="' + product.image + '" alt="' + product.name + '" class="product-detail-img">' +
                '  </div>' +
                '  <div class="col-lg-6">' +
                '    <span class="product-id-badge">' + product.id + '</span>' +
                '    <h1 class="fw-bold mt-3" style="color:#1F3A5F;">' + product.name + '</h1>' +
                '    <p class="text-muted">Category: ' + product.category + '</p>' +
                '    <p class="product-price-large">' + product.price + '</p>' +
                '    <p class="lead">' + (product.description || '') + '</p>' +
                '    <div class="mt-4 d-flex flex-wrap gap-3">' +
                '      <a href="contact.html?product=' + encodeURIComponent(product.id + ' - ' + product.name) + '" class="btn btn-gold btn-lg">Get a Quote</a>' +
                '      <a href="sample-request.html?product=' + encodeURIComponent(product.id + ' - ' + product.name) + '" class="btn btn-outline-navy btn-lg">Request Sample</a>' +
                '    </div>' +
                '  </div>' +
                '</div>';
        }

        // 页脚
        const social = site.socialLinks || {};
        const icons = { facebook: '📘', tiktok: '🎵', linkedin: '💼', instagram: '📸' };
        let socialHtml = '';
        for (const key in icons) {
            if (social[key] && social[key] !== '#') {
                socialHtml += '<a href="' + social[key] + '" target="_blank">' + icons[key] + '</a>';
            }
        }
        if (site.whatsapp) {
            socialHtml += '<a href="https://wa.me/' + site.whatsapp.replace(/[^0-9]/g,'') + '" target="_blank">💬</a>';
        }
        document.getElementById('footerSocial').innerHTML = socialHtml;
        document.getElementById('footerContact').textContent = 'Email: ' + (site.contactEmail || '') + ' | Phone: ' + (site.phone || '');
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
